# ══════════════════════════════════════════════════════════════════════════════
# EMBEDDING MODELS
# All models are free from Hugging Face
# ══════════════════════════════════════════════════════════════════════════════
# ┌─────────────────────────────────────────┬──────┬──────────┬──────────────┐
# │ Model                                   │ Dim  │ MTEB (%) │ Speed        │
# ├─────────────────────────────────────────┼──────┼──────────┼──────────────┤
# │ sentence-transformers/all-MiniLM-L6-v2  │ 384  │ ~55%     │ Very fast    │
# │ BAAI/bge-base-en-v1.5                   │ 768  │ ~63%     │ 2x slower    │
# │ intfloat/e5-base-v2                     │ 768  │ ~62%     │ 2x slower    │
# │ intfloat/multilingual-e5-base           │ 768  │ ~61%     │ Multilingual │
# │ BAAI/bge-large-en-v1.5                  │ 1024 │ ~65%     │ 4x slower    │
# │ intfloat/e5-large-v2                    │ 1024 │ ~64%     │ 4x slower    │
# └─────────────────────────────────────────┴──────┴──────────┴──────────────┘

indexing:
  # Chunker type: "graph" (default, uses dependency context)
  chunker_type: "graph"

  # Vector Engine type: sentence-transformers (default)
  engine_type: "sentence-transformers"

  # Embedding model (sentence-transformers compatible)
  # Options: see table above
  engine_name: "sentence-transformers/all-MiniLM-L6-v2"

  # Chunk parameters
  chunk_size: 350 # Max tokens per chunk (approx)
  overlap: 5 # Lines to keep between chunks for context
  max_deps: 5 # Max dependencies to show in chunk header

  # Block keywords for semantic chunking (Envision DSL)
  block_keywords:
    - "read"
    - "write"
    - "export"
    - "def"
    - "process"
    - "store"
    - "import"
    - "show"
    - "table"
    - "where"
    - "keep"
    - "when"

# Reranker Models Available (all free from Hugging Face):
# ┌─────────────────────────────────────────────────────┬─────────────┬───────────────────────────┐
# │ Type         │ Default Model                        │ Description                             │
# ├──────────────┼──────────────────────────────────────┼─────────────────────────────────────────┤
# │ cross-encoder│ cross-encoder/ms-marco-MiniLM-L-6-v2 │ Fast general-purpose (default)          │
# │ bge          │ BAAI/bge-reranker-base               │ Robust for technical/code terms         │
# │ mxbai        │ mixedbread-ai/mxbai-reranker-base-v1 │ Best speed/accuracy tradeoff            │
# │ answerai     │ answerdotai/AnswerDotAI-Optimized... │ Optimized for Q&A scenarios             │
# └──────────────┴──────────────────────────────────────┴─────────────────────────────────────────┘

retrieval:
  # Reranker type: heuristic, cross-encoder, bge, mxbai, answerai
  # - heuristic: Fast domain-specific heuristics (no ML model, recommended)
  # - oriented: Fast domain-specific heuristics (no ML model, recommended)
  # - cross-encoder: MS-MARCO cross-encoder (general purpose)
  # - bge: BAAI/bge-reranker (robust for technical terms)
  # - mxbai/answerai: Require HuggingFace authentication
  reranker_type: "oriented"
  # Optional: override default model for ML rerankers
  # reranker_name: "BAAI/bge-reranker-base"
  top_k_recall: 50

  # Enable Graph Horizon (Related Nodes) in output
  enable_horizon: true
  top_k_final: 5
  use_reranker: true
  # Use contextual reranking (ML rerankers only)
  contextual_reranking: false

benchmark:
  questions_file: "src/code_rag/benchmark/questions.json"
  log_dir: "datas/code_rag/benchmark"
  oriented_log_dir: "datas/code_rag/benchmark/oriented"
  top_k: 5
  recall_k: 50

# ══════════════════════════════════════════════════════════════════════════════
# HEURISTIC RERANKER CONFIGURATION
# Only used when reranker_type: "heuristic"
# Weights optimized via exhaustive grid search (14641 combos) - Best Gain: +1.6%
# ══════════════════════════════════════════════════════════════════════════════
heuristic_reranking:
  # ─────────────────────────────────────────────────────────────────────────────
  # MAIN STRATEGY WEIGHTS (optimized via grid search)
  # These control how much each strategy contributes to the final score.
  # Final score = base_score + Σ(weight_i × strategy_score_i)
  # ─────────────────────────────────────────────────────────────────────────────
  weights:
    # TTB: Technical Term Boost (Strategy 1)
    # Purpose: Boost chunks containing exact technical terms from query
    # (camelCase identifiers, script paths, formulas with =)
    # Contains exact technical terms from query
    # (camelCase identifiers, script paths, formulas with =)
    # Higher value = stronger boost for exact term matches
    technical_term_boost: 0.7

    # PDS: Pattern Density Score (Strategy 4)
    # Purpose: Favor chunks containing multiple query words
    # Higher value = prefer chunks with more keyword coverage
    pattern_density: 0.4

    # DB: Definition Boost (Strategy 5)
    # Purpose: Boost chunks that define/declare variables or functions
    # Set to 0.0 (disabled) because not helpful for this corpus
    definition_boost: 0.0

    # SDP: Source Diversity Penalty (Strategy 2)
    # Purpose: Penalize repeated chunks from same source file
    # Higher value = stronger diversity enforcement
    diversity_penalty: 0.1

  # ─────────────────────────────────────────────────────────────────────────────
  # TTB SUB-SCORES
  # Different types of technical terms get different boost amounts.
  # These are multiplied before normalization.
  # ─────────────────────────────────────────────────────────────────────────────
  ttb_scores:
    # Path match: term starts with "/" (e.g., "/1. utilities/Modules")
    # Highest boost because paths are very specific identifiers
    path_match: 0.3

    # Formula match: term contains "=" or "." (e.g., "carryingCost = 0.3")
    # High boost for variable assignments and object properties
    formula_match: 0.2

    # Identifier match: camelCase, PascalCase, snake_case terms
    # Standard boost for code identifiers
    identifier_match: 0.3

  # ─────────────────────────────────────────────────────────────────────────────
  # PDS THRESHOLDS
  # Pattern Density Score calculation parameters.
  # density = matched_words / total_query_words
  # ─────────────────────────────────────────────────────────────────────────────
  pds_params:
    # If density exceeds this threshold, give bonus
    # Purpose: Extra reward for chunks matching >50% of query words
    density_bonus_threshold: 0.4

    # Bonus added when threshold exceeded
    density_bonus: 0.25

  # ─────────────────────────────────────────────────────────────────────────────
  # DB SCORES
  # Definition Boost scoring parameters.
  # Applied when chunk contains code definitions matching query terms.
  # ─────────────────────────────────────────────────────────────────────────────
  db_scores:
    # Score when a definition (const, table, def) matches a query term
    definition_match: 0.5

    # Score when chunk is from Modules/Functions folder (typical definition locations)
    module_location: 0.2

  # ─────────────────────────────────────────────────────────────────────────────
  # SDP PROGRESSIVE PENALTIES
  # Source Diversity Penalty applied progressively for repeated sources.
  # penalty = penalty_level × diversity_penalty_weight
  # ─────────────────────────────────────────────────────────────────────────────
  sdp_penalties:
    # 2nd chunk from same source: mild penalty
    first_repeat: 0.05

    # 3rd chunk from same source: moderate penalty
    second_repeat: 0.15

    # 4th+ chunk from same source: strong penalty
    third_plus: 0.3

input:
  network_file: "datas/network/network.json"

output:
  index_file: "datas/code_rag/index/faiss.index"
  metadata_file: "datas/code_rag/index/metadata.json"

# ══════════════════════════════════════════════════════════════════════════════
# ORIENTED RERANKER CONFIGURATION
# Only used when reranker_type: "oriented" (inherits heuristic weights too)
# ══════════════════════════════════════════════════════════════════════════════
oriented_reranking:
  weights:
    keyword_match: 1.5 # Boost per general keyword (def, show)
    term_match: 2.0 # Boost per technical term (StockEvol, Catalog)
