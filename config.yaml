# =============================================================================
# ENVISION RAG CONFIGURATION (PLACEHOLDER)
# =============================================================================

system:
  # Path to the root of the Envision project to analyze
  project_root: "./env_scripts"
  # Directory to store generated artifacts (indexes, graphs)
  data_dir: "./data"

agent:
  # The "Brain" of the operation
  main_model: "mistral"     # High reasoning capability
  fast_model: "mistral-small"     # For quick summaries/routing
  
  # Chain of Thought settings
  max_iterations: 10              # Max "Reason -> Act" loops to prevent infinite cycles
  temperature: 0.0                # Keep it deterministic for logic

graph:
  # Static Analysis settings
  include_patterns: ["**/*.nvn"]
  exclude_patterns: ["**/Old/**/*"]
  
  # Graph storage
  store_path: "${system.data_dir}/dependency_graph.json"

index:
  # Vector Search settings
  chunk_size: 512
  overlap: 50
  store_path: "${system.data_dir}/vector_store"

workflow:
  # Hybrid Search Weights
  use_graph_first: true           # Favor deterministic graph lookups over vector search

# =============================================================================
# LEGACY SECTIONS (Required by ConfigManager)
# =============================================================================
paths:
  data_dir: "data"
  input_dirs: ["env_scripts"]
  pickle_extension: ".pkl" 
  index_extension: ".index"

parser:
  type: "envision"
  supported_extensions: [".nvn"]
  multiline_patterns: true
  case_sensitive: false
  section_delimiter:
    min_chars: 20
    valid_chars: ["~", "=", "-"]
    pattern_prefix: "///"

chunker:
  type: "semantic"
  use_summary_embeddings: true
  summary_model: "mistral"
  summary_prompt: "Summarize..."
  max_chunk_tokens: 512
  overlap_lines: 2
  preserve_boundaries: true
  strategies:
    group_by_section: true
    group_related_assignments: true
    keep_read_statements_separate: true
    include_context_comments: true
  block_priorities:
    comment_block: 1
    read_statement: 2
    table_definition: 3
    assignment: 4
    show_statement: 5
  chars_per_token: 4

embedder:
  default_type: "sentence_transformer"
  text_preparation:
    chars_per_token_code: 3
    truncation_ratio: 0.8
    min_lines_preserve: 1
    max_variable_names: 3
    max_table_names: 5
  sentence_transformer:
    model_name: "all-MiniLM-L6-v2"
    device: "cpu"
    trust_remote_code: false
    normalize_embeddings: true
    batch_size: 32
    max_seq_length: 512
    show_progress_bar: true

retriever:
  type: "faiss"
  files:
    chunks_filename: "chunks"
    index_filename: "faiss"
    metadata_filename: "metadata"
  faiss:
    index_path: "./data/faiss_index"
    index_type: "IndexFlatIP"
    top_k: 10
    search_threshold: 0.7
    use_gpu: false
    nprobe: 10
    nlist: 100
    hnsw_ef_search: 64
    hnsw_m: 16
    hnsw_ef_construction: 200
