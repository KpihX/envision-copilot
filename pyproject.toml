[project]
name = "envision-rag"
version = "3.0.0"
description = "Modular Envision DSL RAG System"
readme = "README.md"
authors = [
    { name = "Ivann KAMDEM", email = "kapoivha@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "langchain-mistralai>=0.1.0",
    "langchain-google-genai>=0.0.1",
    "langchain-groq>=0.0.1",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
llm = "llms.main:main"
network = "envision_preprocess.network:main"
index = "code_rag.index:main"
copilot = "envision_copilot.main:main"
benchmark = "envision_benchmark.main:main"
rag-benchmark = "code_rag.benchmark.main:main"

[build-system]
requires = [
    "uv_build>=0.9.21,<0.10.0",
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.4.0"
]
