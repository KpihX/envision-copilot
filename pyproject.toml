[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envision-rag"
version = "3.0.0"
description = "Modular Envision DSL RAG System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "langchain-mistralai>=0.1.0",
    "langchain-google-genai>=0.0.1",
    "langchain-groq>=0.0.1",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
llm = "llms.main:main"
network = "envision_preprocess.network:main"
index = "code_rag.index:main"
copilot = "envision_copilot.main:main"
benchmark = "envision_benchmark.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llms", "src/envision_preprocess", "src/code_rag", "src/envision_copilot", "src/envision_benchmark"]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.0.0",
]
