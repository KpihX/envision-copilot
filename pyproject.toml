[project]
name = "envision-rag"
version = "0.1.0"
description = "Hybrid RAG system for Envision DSL codebase analysis with LLM-as-Judge benchmarking"
readme = "README.md"
authors = [
    { name = "Ivann KAMDEM", email = "kapoivha@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "rich>=13.0.0",
    "faiss-cpu>=1.7.4",
    "numpy",
    "pyyaml",
    "openai>=2.15.0",
    "google-generativeai>=0.8.6",
    "mistralai>=1.10.0",
    "groq>=1.0.0",
    "python-dotenv>=1.2.1",
    "ollama>=0.6.1",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "sentence-transformers>=5.2.0",
]

[project.scripts]
# Main CLI - Query the RAG system
envision-rag = "envision_rag.main:main"
# Benchmark - Run LLM-as-Judge evaluation
envision-benchmark = "envision_rag.cli.benchmark:main"
# Log Viewer - Replay saved sessions
envision-logs = "envision_rag.cli.logs:main"
# Index Builder - Build FAISS vector index
envision-index = "envision_rag.cli.build_index:main"
# Test Graph Tools
envision-test-graph = "tests.envision_rag.test_graph:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

